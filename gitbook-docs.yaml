$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Wodge
  structure:
    - type: section
      key: section-home
      title: Home
      icon: house
      description: "Start here to explore all Wodge documentation."
      path: home
      default: true
      children:
        - type: space
          key: space-home
          title: Wodge documentation
          path: overview
          default: true
          content:
            directory: ./docs
    - type: section
      key: section-product
      title: Product
      icon: compass
      description: "Start with Wodge’s purpose and the principles shaping its revival."
      path: product
      children:
        - type: space
          key: space-product
          title: Product
          path: overview
          default: true
          content:
            directory: ./docs/product
    - type: section
      key: section-architecture
      title: Architecture
      icon: diagram-project
      description: "Understand how Wodge fits together."
      path: architecture
      children:
        - type: space
          key: space-architecture
          title: Architecture
          path: overview
          default: true
          content:
            directory: ./docs/architecture
    - type: section
      key: section-design
      title: Design
      icon: palette
      description: "Make collaboration feel clear and connected."
      path: design
      children:
        - type: space
          key: space-design
          title: Design
          path: overview
          default: true
          content:
            directory: ./docs/design
    - type: section
      key: section-development
      title: Development
      icon: code
      description: "Find your way from local setup to verified delivery."
      path: development
      children:
        - type: space
          key: space-development
          title: Development
          path: overview
          default: true
          content:
            directory: ./docs/development
    - type: section
      key: section-operations
      title: Operations
      icon: server
      description: "Understand the environments and release responsibilities."
      path: operations
      children:
        - type: space
          key: space-operations
          title: Operations
          path: overview
          default: true
          content:
            directory: ./docs/operations
    - type: section
      key: section-features
      title: Features
      icon: shapes
      description: "Feature behavior, design, and delivery context for Wodge’s collaboration capabilities."
      path: features
      children:
        - type: space
          key: space-workspace-membership
          title: Workspace Setup & Membership
          path: workspace-membership
          default: true
          content:
            directory: ./docs/features/workspace-membership
        - type: space
          key: space-teams-shared-spaces
          title: Teams & Shared Spaces
          path: teams-shared-spaces
          content:
            directory: ./docs/features/teams-shared-spaces
        - type: space
          key: space-team-roles-access
          title: Team Roles & Access
          path: team-roles-access
          content:
            directory: ./docs/features/team-roles-access
        - type: space
          key: space-agent-access
          title: Agent Access
          path: agent-access
          content:
            directory: ./docs/features/agent-access
        - type: space
          key: space-discussions-messaging
          title: Discussions & Messaging
          path: discussions-messaging
          content:
            directory: ./docs/features/discussions-messaging
        - type: space
          key: space-room-calls
          title: Room Calls
          path: room-calls
          content:
            directory: ./docs/features/room-calls
        - type: space
          key: space-pages-embedded-tasks
          title: Pages & Embedded Tasks
          path: pages-embedded-tasks
          content:
            directory: ./docs/features/pages-embedded-tasks
        - type: space
          key: space-demo-billing-limits
          title: Demo Billing & Limits
          path: demo-billing-limits
          content:
            directory: ./docs/features/demo-billing-limits
    - type: section
      key: section-decisions
      title: Decisions
      icon: scale-balanced
      description: "Follow the reasoning behind Wodge’s engineering choices."
      path: decisions
      children:
        - type: space
          key: space-decisions
          title: Decisions
          path: overview
          default: true
          content:
            directory: ./docs/decisions
